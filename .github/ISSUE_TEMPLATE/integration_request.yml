name: Integration request
description: Request an adapter, example, or scanner rule
title: "[Integration]: "
labels: ["integration"]
body:
  - type: input
    id: stack
    attributes:
      label: Stack
      placeholder: "ethers, Privy, Dynamic, Coinbase Wallet, agent framework"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What attribution flow should BAO Toolkit support?
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Current transaction code
      description: Share a minimal public snippet if possible.
  - type: textarea
    id: versions
    attributes:
      label: Versions and reproduction
      description: Include BAO, Node, transaction client and wallet versions, scan scope, and commands. Link a public reproduction if available.
  - type: textarea
    id: evidence
    attributes:
      label: Pilot evidence
      description: Optional before/after pilot reports, CI run, or Proof Set. Share only public evidence; omit keys, credentials and private application data.
  - type: dropdown
    id: outcome
    attributes:
      label: Integration outcome
      options:
        - Not attempted yet
        - Reproduced a finding
        - Accepted a fix
        - Kept the check in CI
